# Weekly update PRs for GitHub Actions and Python dev tooling.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    # Runtime dependency ranges come from the generator; only tooling is ours to bump.
    allow:
      - dependency-type: development
